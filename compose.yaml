services:
  mb-local:
    image: ${MB_CONTROLLER_IMAGE:-ghcr.io/davilag/mb-controller:latest}
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-8080}:8080"
    environment:
      APP_PASSWORD: ${APP_PASSWORD:?Set APP_PASSWORD in .env first}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:8080}
      TZ: ${TZ:-Europe/London}
    volumes:
      - mb-data:/app/data
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
volumes:
  mb-data:
